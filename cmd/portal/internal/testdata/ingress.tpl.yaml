{{ if .IsCustom }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-{{ .Host }}
spec:
  ingressClassName: traefik
  rules:
  - host: '{{ .Host }}'
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-{{ .Host }}
spec:
  dnsNames:
  - {{ .Host }}
  secretName: tls-{{ .Host }}
{{ end }}
