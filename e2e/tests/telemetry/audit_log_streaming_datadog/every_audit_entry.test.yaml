name: Every persisted audit log entry is streamed to datadog, and only those
extra_files_directory: ./var
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: datadog
          type: datadog
          transport: http
          http:
            endpoint: http://127.0.0.1:2626/[[.AppID]]/logs
steps:
  - name: signup_identify
    action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  # Email identification, verified by OTP, persists email.sent (the OTP
  # delivery) and user.created (signup completion) -- two entries from
  # one flow, which is what lets this test compare a set, not a singleton.
  - name: signup_email
    action: input
    input: |
      {
        "identification": "email",
        "login_id": "streaming-datadog-every@example.com"
      }
    output:
      result: |
        {
          "action": {
            "type": "verify"
          }
        }

  - name: signup_verify
    action: input
    input: |
      {
        "code": "111111"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - name: signup_finish
    action: input
    input: |
      {
        "authentication": "primary_oob_otp_email",
        "channels": "email"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - name: wait_for_delivery
    action: hook_server_query
    hook_server_path: "{{ .AppID }}/logs"
    hook_server_min_count: 2
    hook_server_output:
      rows: |
        [
          {
            "evt": { "name": "email.sent" }
          },
          {
            "evt": { "name": "user.created" }
          }
        ]

  # The direct test of "streamed if and only if persisted": the set of
  # activity_type values the audit database holds for this app is exactly
  # the set of evt.name values that arrived at the recorder above -- two
  # rows, two records, same order, mirroring
  # audit_log_streaming/every_audit_entry.test.yaml for the syslog type.
  - name: verify_persisted_matches_streamed
    action: audit_query
    audit_query: |
      SELECT activity_type
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
      ORDER BY created_at, id
    audit_query_output:
      rows: |
        [
          { "activity_type": "email.sent" },
          { "activity_type": "user.created" }
        ]
