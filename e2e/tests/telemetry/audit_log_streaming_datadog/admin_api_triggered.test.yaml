name: An Admin API triggered event streams to datadog with triggered_by admin_api
extra_files_directory: ./var
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: datadog
          type: datadog
          transport: http
          http:
            endpoint: http://127.0.0.1:2626/[[.AppID]]/logs
steps:
  # Admin API's createUser, with sendPassword true, persists three
  # entries: email.sent (the password notification), user.created, and
  # admin_api.mutation.create_user.executed -- the mutation call itself is
  # also audited. user.created and the mutation event are triggered_by
  # admin_api; email.sent is always triggered_by user regardless of who
  # asked for it, by that event's own design. The datadog log object is
  # the one encoding that can prove triggered_by directly: authgear.event
  # carries the event verbatim, including context.triggered_by, which
  # neither the syslog structured data nor any other mapped field
  # surfaces.
  - name: create_user
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation createUserMutation(
          $identityDefinition: IdentityDefinitionLoginID!
          $password: String
          $sendPassword: Boolean
          $setPasswordExpired: Boolean
        ) {
          createUser(
            input: {
              definition: { loginID: $identityDefinition }
              password: $password
              sendPassword: $sendPassword
              setPasswordExpired: $setPasswordExpired
            }
          ) {
            user {
              id
            }
          }
        }
      variables: |
        {
          "identityDefinition": { "key": "email", "value": "{{ .AppID }}@example.com" },
          "password": "SuperSecret123",
          "sendPassword": true,
          "setPasswordExpired": true
        }
    admin_api_output:
      result: |
        {
          "data": {
            "createUser": {
              "user": {
                "id": "[[string]]"
              }
            }
          },
          "errors": null
        }

  - name: verify_persisted
    action: audit_query
    audit_query: |
      SELECT activity_type
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
      ORDER BY created_at, id
    audit_query_output:
      rows: |
        [
          { "activity_type": "email.sent" },
          { "activity_type": "user.created" },
          { "activity_type": "admin_api.mutation.create_user.executed" }
        ]

  - name: wait_for_delivery
    action: hook_server_query
    hook_server_path: "{{ .AppID }}/logs"
    hook_server_min_count: 3
    hook_server_output:
      rows: |
        [
          {
            "evt": { "name": "email.sent" }
          },
          {
            "evt": { "name": "user.created" },
            "authgear": {
              "event": {
                "type": "user.created",
                "context": {
                  "triggered_by": "admin_api"
                }
              }
            }
          },
          {
            "evt": { "name": "admin_api.mutation.create_user.executed" },
            "authgear": {
              "event": {
                "type": "admin_api.mutation.create_user.executed",
                "context": {
                  "triggered_by": "admin_api"
                }
              }
            }
          }
        ]
