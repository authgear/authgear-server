name: TLS with a project-supplied certificate_authority is delivered
extra_files_directory: ./var
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: tls
          type: syslog
          transport: tcp
          tcp:
            address: 127.0.0.1:6514
            tls:
              enabled: true
          syslog:
            format: rfc5424
            framing: newline
steps:
  - name: signup_identify
    action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: signup_username
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "streaming-user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - name: signup_password
    action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "SuperSecret123"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  # This can only succeed if the TLS handshake completed and the
  # recorder's certificate verified against the project's
  # certificate_authority (var/authgear.secrets.yaml). The stream is
  # named "tls" to match the secret's stream_name; a mismatch would not
  # fail the load -- an orphaned tls secret item is tolerated, not
  # rejected -- it would silently fall back to the system trust store
  # instead, and the handshake would fail.
  - name: wait_for_delivery
    action: syslog_server_query
    syslog_server_port: 6514
    syslog_server_min_count: 1
    syslog_server_output:
      rows: |
        [
          {
            "framing": "newline",
            "structured_data": {
              "app_id": "{{ .AppID }}",
              "activity_type": "user.created"
            }
          }
        ]
