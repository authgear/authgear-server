name: Audit log streaming delivers an entry as RFC 5424 over TCP with octet counting framing
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: collector
          type: syslog
          transport: tcp
          tcp:
            address: 127.0.0.1:5140
          syslog:
            format: rfc5424
            framing: octet_counting
steps:
  - name: signup_identify
    action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: signup_username
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "streaming-user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - name: signup_password
    action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "SuperSecret123"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  # A wrong octet count desynchronises the stream and the recorder would
  # instead record a parse_error on this or a later frame, so getting
  # here with a clean, fully-parsed message proves the length prefix the
  # sender wrote matched the bytes that followed.
  - name: wait_for_delivery
    action: syslog_server_query
    syslog_server_port: 5140
    syslog_server_min_count: 1
    syslog_server_output:
      rows: |
        [
          {
            "framing": "octet_counting",
            "structured_data": {
              "app_id": "{{ .AppID }}",
              "activity_type": "user.created"
            },
            "message": "[[string]]"
          }
        ]
