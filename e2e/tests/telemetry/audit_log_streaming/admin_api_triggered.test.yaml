name: An Admin API triggered event streams the same as a user-triggered one
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: collector
          type: syslog
          transport: tcp
          tcp:
            address: 127.0.0.1:5140
          syslog:
            format: rfc5424
            framing: newline
steps:
  # Admin API's createUser persists two entries, both triggered_by
  # admin_api: user.created and admin_api.mutation.create_user.executed.
  # sendPassword is left off: email.sent is dispatched from an async
  # goroutine, so its delivery order is nondeterministic. Nothing in the producer or
  # the encoder reads triggered_by, so this is the direct proof that
  # streaming is not accidentally gated on how an entry was triggered.
  - name: create_user
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation createUserMutation(
          $identityDefinition: IdentityDefinitionLoginID!
          $password: String
        ) {
          createUser(
            input: {
              definition: { loginID: $identityDefinition }
              password: $password
            }
          ) {
            user {
              id
            }
          }
        }
      variables: |
        {
          "identityDefinition": { "key": "email", "value": "{{ .AppID }}@example.com" },
          "password": "SuperSecret123"
        }
    admin_api_output:
      result: |
        {
          "data": {
            "createUser": {
              "user": {
                "id": "[[string]]"
              }
            }
          },
          "errors": null
        }

  - name: verify_persisted
    action: audit_query
    audit_query: |
      SELECT activity_type
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
      ORDER BY activity_type
    audit_query_output:
      rows: |
        [
          { "activity_type": "admin_api.mutation.create_user.executed" },
          { "activity_type": "user.created" }
        ]

  - name: wait_for_delivery
    action: syslog_server_query
    syslog_server_port: 5140
    syslog_server_min_count: 2
    syslog_server_output:
      rows: |
        [
          {
            "structured_data": {
              "app_id": "{{ .AppID }}",
              "activity_type": "user.created"
            }
          },
          {
            "structured_data": {
              "app_id": "{{ .AppID }}",
              "activity_type": "admin_api.mutation.create_user.executed"
            }
          }
        ]
