name: telemetry.audit_logs.streaming.disabled stops delivery at runtime
authgear.yaml:
  override: |
    telemetry:
      audit_logs:
        streams:
        - name: collector
          type: syslog
          transport: tcp
          tcp:
            address: 127.0.0.1:5140
          syslog:
            format: rfc5424
            framing: newline
authgear.features.yaml:
  override: |
    telemetry:
      audit_logs:
        streaming:
          disabled: true
steps:
  - name: signup_identify
    action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: signup_username
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "streaming-user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - name: signup_password
    action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "SuperSecret123"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  # This is the runtime gate (Producer.Enqueue checking Disabled), not
  # the save-time gate: the e2e runner writes the config source
  # directly rather than through AuthgearYAMLDescriptor.UpdateResource,
  # so the save-time rejection is not reachable here. Nothing is ever
  # queued for this app, so there is nothing to wait for -- give
  # delivery a window it would use if it were (wrongly) going to happen,
  # then assert zero.
  - name: wait_before_checking
    action: sleep
    sleep_for: 3s

  - name: verify_nothing_delivered
    action: syslog_server_query
    syslog_server_port: 5140
    syslog_server_min_count: 0
    syslog_server_output:
      rows: "[]"
