name: CORS allows the origins of the Custom UI pages
authgear.yaml:
  override: |
    ui:
      custom_ui_endpoints:
        login_link: http://project-link.example.com/login-link
    oauth:
      clients:
      - client_id: e2e
        name: e2e
        x_application_type: spa
        redirect_uris:
        - http://localhost:4000
        x_custom_ui_uri: http://client-ui.example.com/auth
steps:
  - name: preflight_project_login_link_origin
    action: http_request
    http_request_method: OPTIONS
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/api/v1/login_link/approve
    http_request_headers:
      Origin: http://project-link.example.com
      Access-Control-Request-Method: POST
    http_output:
      headers:
        Access-Control-Allow-Origin: http://project-link.example.com

  - name: preflight_client_custom_ui_origin
    action: http_request
    http_request_method: OPTIONS
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/api/v1/authentication_flows
    http_request_headers:
      Origin: http://client-ui.example.com
      Access-Control-Request-Method: POST
    http_output:
      headers:
        Access-Control-Allow-Origin: http://client-ui.example.com

  - name: preflight_other_origin
    action: http_request
    http_request_method: OPTIONS
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/api/v1/login_link/approve
    http_request_headers:
      Origin: http://other.example.com
      Access-Control-Request-Method: POST
    http_output:
      headers:
        Access-Control-Allow-Origin: ""
