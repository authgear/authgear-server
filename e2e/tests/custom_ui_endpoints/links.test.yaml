---
name: An account recovery link points to the project Custom UI account_recovery page
authgear.yaml:
  override: |
    ui:
      custom_ui_endpoints:
        account_recovery: http://project-ui.example.com/reset
    authentication_flow:
      account_recovery_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: email
            steps:
            - type: select_destination
              allowed_channels:
              - channel: email
                otp_form: link
        - type: verify_account_recovery_code
        - type: reset_password
before:
  - type: user_import
    user_import: users.json
steps:
  - action: "create"
    input: |
      {
        "type": "account_recovery",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "email",
        "login_id": "e2e_cuie_recovery@example.com"
      }
    output:
      result: |
        {
          "action": {
            "type": "select_destination"
          }
        }

  - action: input
    input: |
      {
        "index": 0
      }
    output:
      result: |
        {
          "action": {
            "type": "verify_account_recovery_code",
            "data": {
              "otp_form": "link"
            }
          }
        }

  - name: wait_for_email_delivery
    action: sleep
    sleep_for: 2s

  - name: the_link_opens_the_project_page
    action: smtp_log_query
    smtp_log_subject: "[Authgear] Reset password instruction"
    smtp_log_recipient: "e2e_cuie_recovery@example.com"
    smtp_log_text_contains:
      - 'http://project-ui.example.com/reset?code={{ linkOTPCode "email" "e2e_cuie_recovery@example.com" }}'
    smtp_log_output:
      rows: |
        [
          {
            "subject": "[Authgear] Reset password instruction",
            "recipient": "e2e_cuie_recovery@example.com"
          }
        ]

  - action: input
    input: |
      {
        "account_recovery_code": "{{ linkOTPCode "email" "e2e_cuie_recovery@example.com" }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "reset_password"
          }
        }
