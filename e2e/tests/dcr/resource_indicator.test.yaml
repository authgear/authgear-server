          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/orders",
            scope: "read:orders",
            accessPolicy: { allowDynamicThirdPartyClientAccess: true }
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "client_name": "E2E refresh resource-binding DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_setup_scope:
      - openid
      - offline_access
      - read:orders
    oauth_setup_resource: https://api.example.com/orders

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: approve_consent
    action: oauth_approve_consent
    oauth_approve_consent_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.approve_consent.result.redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: refresh_without_resource
    action: oauth_refresh_token
    oauth_refresh_token_refresh_token: "{{ .steps.exchange_code.result.refresh_token }}"
    oauth_refresh_token_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    output:
      result: |
        {
          "access_token_is_jwt": true,
          "access_token_claims": {
            "aud": ["https://api.example.com/orders"]
          }
        }

  - name: refresh_with_correct_resource
    action: oauth_refresh_token
    oauth_refresh_token_refresh_token: "{{ .steps.exchange_code.result.refresh_token }}"
    oauth_refresh_token_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_refresh_token_resource: https://api.example.com/orders
    output:
      result: |
        {
          "access_token_is_jwt": true,
          "access_token_claims": {
            "aud": ["https://api.example.com/orders"]
          }
        }

  - name: refresh_with_different_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: refresh_token
      client_id: "{{ .steps.register.result.http_json_body.client_id }}"
      refresh_token: "{{ .steps.exchange_code.result.refresh_token }}"
      resource: https://api.example.com/inventory
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_target"
        }
