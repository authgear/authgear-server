    http_request_body: |
      {
        "client_name": "E2E opaque-by-default DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_setup_scope:
      - openid

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: approve_consent
    action: oauth_approve_consent
    oauth_approve_consent_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.approve_consent.result.redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    output:
      result: |
        {
          "access_token_is_jwt": false
        }

  - name: userinfo
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/userinfo
    http_request_headers:
      Authorization: "Bearer {{ .steps.exchange_code.result.access_token }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "sub": "[[string]]"
        }

  # Opaque access token + third-party client is exactly the conjunction
  # pkg/resolver/handler/resolve.go's opaque-token gate rejects: this token
  # is scoped to /oauth2/userinfo only (asserted above) and must not also
  # work at the resolver, unlike the resource-bound JWT case in the sibling
  # test above (same third-party client, different token type).
  - name: resolve_opaque_token
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4001/resolve
    http_request_headers:
      Authorization: "Bearer {{ .steps.exchange_code.result.access_token }}"
    http_output:
      http_status: 200
      headers:
        X-Authgear-Session-Valid: "false"

---

