          "errors": null
        }

  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
      Authorization: "Bearer {{ .steps.create_iat.result.data.createInitialAccessToken.token }}"
    http_request_body: |
      {
        "client_name": "E2E cache invalidation DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  # Completing the flow forces at least one resolve of this client_id
  # (ValidateRequestWithoutTx at /oauth2/authorize, and again at token
  # exchange), which is enough to warm the Redis cache
  # (pkg/lib/oauthclient/cache_client.go) with a positive entry.
  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: delete_client
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation($clientID: String!) {
          deleteDynamicClient(input: { clientID: $clientID }) {
            ok
          }
        }
      variables: |
        {
          "clientID": "{{ .steps.register.result.http_json_body.client_id }}"
        }
    admin_api_output:
      result: |
        {
          "data": {
            "deleteDynamicClient": {
              "ok": true
            }
          },
          "errors": null
        }

  # Run immediately after deletion, with no sleep: this must fail because
  # Commands.DeleteClient's DidCommitTx hook invalidated the Redis cache
  # entry, not because the cache TTL (5 minutes) happened to expire. A
  # broken invalidation would instead resolve the client from the stale
  # cache entry and let this request through.
  - name: authorize_after_delete
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: "{{ .steps.register.result.http_json_body.client_id }}"
      response_type: code
      redirect_uri: http://localhost:4000
    http_request_follow_redirects: false
    http_output:
      http_status: 400
      html_text_contains:
        - unauthorized_client
