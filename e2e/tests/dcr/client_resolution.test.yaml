name: THIRD_PARTY DCR client completes a full authorization-code flow with consent, and its access token works at userinfo
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
before:
  - type: user_import
    user_import: users.json
steps:
  # No Authorization header, and initial_access_token_required is false, so
  # this registers a THIRD_PARTY client by default (Part 2 behavior).
  # application_type must be "native" so redirect_uris can legally use
  # http://localhost:4000 -- the e2e test client's oauth_setup/
  # oauth_exchange_code actions hardcode that exact URL and cannot be
  # overridden (a "web" client would reject it outright, requiring https).
  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "client_name": "E2E third-party DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  # full-access scope is excluded: HasFullAccessScope() is false for a
  # dynamic third-party client (docs/plans/dcr/2026-08-17-03-client-resolution.md
  # §2), and the default e2e scope set includes it.
  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_setup_scope:
      - openid
      - offline_access

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  # This client is a dynamically resolved THIRD_PARTY client, so it must
  # require explicit consent exactly like a static third_party_app client
  # does -- oauth_approve_consent only succeeds if a consent page was
  # actually reached.
  - name: approve_consent
    action: oauth_approve_consent
    oauth_approve_consent_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.approve_consent.result.redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    output:
      result: |
        {
          "id_token": {
            "iss": "[[string]]"
          }
        }

  # DCR clients always issue opaque access tokens (IssueJWTAccessToken is
  # fixed to false), so this also proves the opaque token is accepted at
  # userinfo, not just that the code exchange succeeded.
  - name: userinfo
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/userinfo
    http_request_headers:
      Authorization: "Bearer {{ .steps.exchange_code.result.access_token }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "sub": "[[string]]"
        }

---

name: FIRST_PARTY DCR client completes a full authorization-code flow with consent skipped, and its access token works at userinfo
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: { type: FIRST_PARTY }) {
            token
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]"
            }
          },
          "errors": null
        }

  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
      Authorization: "Bearer {{ .steps.create_iat.result.data.createInitialAccessToken.token }}"
    http_request_body: |
      {
        "client_name": "E2E first-party DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  # No scope override: HasFullAccessScope() is true for a first-party DCR
  # client, so the e2e default scope set (including full-access) is fine.
  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  # Straight from finish_redirect_uri, no oauth_approve_consent step: a
  # FIRST_PARTY DCR client must skip consent exactly like a static
  # first-party client. If consent were wrongly required, finish_redirect_uri
  # would carry a redirect to /oauth2/consent instead of a code, and this
  # exchange would fail to find one.
  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    output:
      result: |
        {
          "id_token": {
            "iss": "[[string]]"
          }
        }

  - name: userinfo
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/userinfo
    http_request_headers:
      Authorization: "Bearer {{ .steps.exchange_code.result.access_token }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "sub": "[[string]]"
        }

---

