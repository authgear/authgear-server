name: An OTP email sent during a DCR client's login flow resolves the client name without error
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
    authenticator:
      oob_otp:
        email:
          email_otp_mode: code
before:
  - type: user_import
    user_import: users_email.json
steps:
  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "client_name": "E2E notification DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_setup_scope:
      - openid
      - offline_access

  # url_query carries the DCR client_id into the flow's UIParams, which is
  # what translation.Service.prepareTemplateVariables reads via
  # OAuthClientResolver.ResolveClient (pkg/lib/translation/service.go) when
  # composing the OTP email below.
  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "email",
        "login_id": "login@example.com"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  # Triggering the OTP send is the point of this test: if
  # OAuthClientResolver.ResolveClient panicked or errored for this DCR
  # client_id (e.g. a wiring regression, or the resolver being called
  # outside any DB scope -- see Part 3 plan §4.2), this step would fail
  # instead of advancing to verify_oob_otp_data.
  - name: send_otp
    action: input
    input: |
      {
        "authentication": "primary_oob_otp_email",
        "index": 1,
        "channel": "email"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate",
            "authentication": "primary_oob_otp_email",
            "data": {
              "type": "verify_oob_otp_data"
            }
          }
        }

  - name: verify_email_sent
    action: audit_query
    audit_query: |
      SELECT
        activity_type,
        data->'payload'->>'recipient' AS recipient
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
        AND activity_type = 'email.sent'
      ORDER BY created_at, id
    audit_query_output:
      rows: |
        [
          {
            "activity_type": "email.sent",
            "recipient": "login@example.com"
          }
        ]

---

