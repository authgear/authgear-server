      Authorization: "Bearer {{ .steps.create_iat.result.data.createInitialAccessToken.token }}"
    http_request_body: |
      {
        "client_name": "E2E revoke DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  - name: revoke
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/revoke
    http_request_form_urlencoded_body:
      token: "{{ .steps.exchange_code.result.refresh_token }}"
      client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    http_output:
      http_status: 200

  # Independent proof the grant is actually gone, not just that /oauth2/revoke
  # returned 200 (RevokeHandler.Handle never errors on an already-gone grant
  # either, so the 200 above alone would not distinguish "revoked" from
  # "the resolver silently failed to find it").
  - name: verify_offline_grant_revoked
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: refresh_token
      client_id: "{{ .steps.register.result.http_json_body.client_id }}"
      refresh_token: "{{ .steps.exchange_code.result.refresh_token }}"
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_grant"
        }

---

name: /oauth2/end_session silently logs out a DCR client's session
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: { type: FIRST_PARTY }) {
            token
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]"
            }
          },
          "errors": null
        }

  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
      Authorization: "Bearer {{ .steps.create_iat.result.data.createInitialAccessToken.token }}"
    http_request_body: |
      {
        "client_name": "E2E end_session DCR client",
        "application_type": "native",
        "redirect_uris": ["http://localhost:4000"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: "{{ .steps.register.result.http_json_body.client_id }}"
    oauth_setup_sso_enabled: true

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    oauth_exchange_code_client_id: "{{ .steps.register.result.http_json_body.client_id }}"

  # client.IsFirstParty() && same SSO group fires the silent-logout fast path
  # (handler_end_session.go's resolveIDTokenHintSession, which must resolve
  # the DCR client via OAuthClientResolver -- not h.Config.GetClient -- to
  # find it at all), which is what proves the DCR client resolved correctly.
  # The final redirect is still 302, not 303: DCR clients never have any
  # PostLogoutRedirectURIs (client.md), so validateRedirectURI (a separate,
  # deliberately still-static-only check, Part 3 plan §6) can never match
  # this DCR client's post_logout_redirect_uri and falls back to the
  # settings page. A URI not shared with any static e2e client is used here
  # specifically so that fallback isn't accidentally bypassed by a
  # coincidental string match against an unrelated static client's own
  # registered redirect URIs.
  - name: end_session
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/end_session
    http_request_query:
      id_token_hint: "{{ .steps.exchange_code.result.raw_id_token }}"
      post_logout_redirect_uri: http://localhost:4000/dcr-e2e-not-a-registered-redirect-uri
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  # Independent proof the session/offline grant was actually revoked by the
  # silent-logout fast path, not just that some redirect happened.
  - name: verify_offline_grant_revoked
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: refresh_token
      client_id: "{{ .steps.register.result.http_json_body.client_id }}"
      refresh_token: "{{ .steps.exchange_code.result.refresh_token }}"
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_grant"
        }

---

