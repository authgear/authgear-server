name: Open registration allows registering without an IAT as third-party
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
steps:
  - name: register
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "redirect_uris": ["https://mcp-client.example.com/callback"]
      }
    http_output:
      http_status: 201
      json_body: |
        {
          "client_id": "[[string]]"
        }
  - name: verify_third_party
    action: admin_api_graphql
    admin_api_request:
      query: |
        query {
          dynamicClients {
            edges {
              node {
                clientID
                kind
              }
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "dynamicClients": {
              "edges": [
                {
                  "node": {
                    "clientID": "{{ .steps.register.result.http_json_body.client_id }}",
                    "kind": "THIRD_PARTY"
                  }
                }
              ]
            }
          },
          "errors": null
        }

---

name: Open registration rejects an unsupported application_type
authgear.yaml:
  override: |
    oauth:
      dynamic_client_registration:
        enabled: true
        initial_access_token_required: false
steps:
  - action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/register
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "redirect_uris": ["https://example.com/callback"],
        "application_type": "m2m"
      }
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_client_metadata"
        }
