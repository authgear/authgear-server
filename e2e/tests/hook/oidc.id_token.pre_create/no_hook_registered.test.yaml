name: oidc.id_token.pre_create payload resolve is skipped when no hook is registered
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    identity:
      login_id:
        keys:
        - key: email
          type: email
before:
  - type: user_import
    user_import: users.json
steps:
  - name: oauth_setup
    action: oauth_setup

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "email",
        "login_id": "carried-user@example.com"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    output:
      result: |
        {
          "id_token": {
            "sub": "[[string]]",
            "x_echo_sub": "[[never]]",
            "x_echo_email": "[[never]]",
            "x_echo_is_verified": "[[never]]",
            "x_echo_identity_count": "[[never]]"
          }
        }
