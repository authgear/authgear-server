name: The hook rejects a field of the form with invalid_form_field (UC4)
extra_files_directory: ./var
authgear.yaml:
  override: |
    hook:
      blocking_handlers:
      - event: authentication.form.post_submitted
        url: authgeardeno:///deno/formcheckemployee.ts
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_employee_id
          type: string
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: employee
            fields:
            - user_profile:
                pointer: /x_employee_id
                required: true
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form"
          }
        }

  - name: rejected_field
    action: input
    input: |
      {
        "fields": [
          { "key": "/x_employee_id", "value": "E99999" }
        ]
      }
    output:
      error: |
        {
          "name": "Forbidden",
          "reason": "HookDisallowed",
          "code": 403,
          "info": {
            "event_type": "authentication.form.post_submitted",
            "reasons": [
              {
                "title": "Invalid employee ID",
                "reasons": [
                  {
                    "type": "invalid_form_field",
                    "key": "/x_employee_id",
                    "message": "Unknown employee"
                  }
                ]
              }
            ]
          }
        }

  # The state token stays valid, and the hook sees the form name and the applied user.
  - name: accepted
    action: input
    input: |
      {
        "fields": [
          { "key": "/x_employee_id", "value": "E10234" }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT custom_attributes->>'0000' AS employee_id
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "employee_id": "E10234"
          }
        ]
