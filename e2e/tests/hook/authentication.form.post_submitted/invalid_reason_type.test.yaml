name: A reason of an unknown type is an invalid hook response
extra_files_directory: ./var
authgear.yaml:
  override: |
    hook:
      blocking_handlers:
      - event: authentication.form.post_submitted
        url: authgeardeno:///deno/formbadreasontype.ts
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_employee_id
          type: string
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: employee
            fields:
            - user_profile:
                pointer: /x_employee_id
                required: true
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form"
          }
        }

  - action: input
    input: |
      {
        "fields": [
          { "key": "/x_employee_id", "value": "E10234" }
        ]
      }
    output:
      error: |
        {
          "reason": "HookInvalidResponse"
        }
