name: A hook mutation that meets a constraint is applied
extra_files_directory: ./var
authgear.yaml:
  override: |
    hook:
      blocking_handlers:
      - event: user.pre_create
        url: authgeardeno:///deno/mutatevalid.ts
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_employee_id
          type: string
          pattern: "^E[0-9]+$"
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_hook_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT custom_attributes->>'0000' AS employee_id FROM _auth_user WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          { "employee_id": "E123" }
        ]
