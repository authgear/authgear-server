name: select_account continues without any page render when id_token_hint matches the current IDP session
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    identity:
      login_id:
        keys:
        - key: email
          type: email
before:
  - type: user_import
    user_import: users.json
steps:
  # First OAuth authorization - no session yet, log in with email/password.
  #
  # NOTE: We deliberately build the /oauth2/authorize request manually
  # instead of using `action: oauth_setup`, because SetupOAuth() always
  # sends x_sso_enabled=false, which suppresses the IDP session cookie (see
  # AuthorizationRequest.SuppressIDPSessionCookie() in
  # pkg/lib/oauth/protocol/authz.go). This test needs the webapp login to
  # actually persist an IDP session cookie so that the second authorization
  # below can be resolved by /authflow/v2/select_account's user_id_hint
  # branch.
  - name: authorize_1
    action: http_request
    http_request_method: GET
    http_request_url: http://127.0.0.1:4000/oauth2/authorize
    http_request_follow_redirects: false
    http_request_query:
      response_type: code
      client_id: e2e
      redirect_uri: http://localhost:4000
      code_challenge_method: S256
      code_challenge: lSo1Ui9pr2_uxxYYJeX3kYmXFqc2xEg5-t7JYLY_K_4
      scope: "openid offline_access https://authgear.com/scopes/full-access"
    http_output:
      http_status: 302
  - name: get_login_page
    action: http_request
    http_request_method: GET
    http_request_url: "http://127.0.0.1:4000/login?{{ (urlParse .steps.authorize_1.result.http_response_headers.location).query }}"
    http_output:
      http_status: 200
      redirect_path: /login
      html_xpath_exists:
        - /html/body//form//input[@name='x_login_id']
  - name: submit_login_id
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.get_login_page.result.http_final_url }}"
    http_request_form_urlencoded_body:
      x_login_id_input_type: email
      x_login_id: select-account-webapp@example.com
      x_action: login_id
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/enter_password
      html_xpath_exists:
        - /html/body//form//input[@name='x_password']
  - name: submit_password
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.submit_login_id.result.http_final_url }}"
    http_request_follow_redirects: false
    http_request_form_urlencoded_body:
      x_password: password
    http_output:
      http_status: 302
  - name: finish_flow
    action: http_request
    http_request_method: GET
    http_request_url: "http://127.0.0.1:4000{{ .steps.submit_password.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302
  - name: oauth_exchange_code_1
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "C~higTZz5CcHWA2UfOg1X.u~EX0OoJkERLbso0YeFfEaqi3eki.JTEQ5SXJR5fE~"
    oauth_exchange_code_redirect_uri: "{{ .steps.finish_flow.result.http_response_headers.location }}"
    output:
      result: |
        {
          "id_token": {
            "sub": "[[string]]"
          },
          "raw_id_token": "[[string]]"
        }

  # Second OAuth authorization while the IDP session established by the
  # first login is still valid, this time with id_token_hint identifying
  # the same user and no prompt=login. select_account's user_id_hint branch
  # must resolve this WITHOUT ever rendering "Continue as X": it advances
  # the resolved login flow's identify step with
  # {"identification": "select_account", "index": <n>} directly inside its
  # GET handler (see AuthflowV2SelectAccountHandler.get in select_account.go),
  # the same AdvanceWithInput call the button-driven "continue" action uses,
  # just triggered automatically instead of by a user click.
  #
  # We follow the redirect chain manually (http_request_follow_redirects:
  # false at every hop) instead of letting a single request auto-follow it
  # to completion. Auto-following would walk all the way through consent to
  # the client's own redirect_uri (http://localhost:4000, chosen to share
  # this server's host:port for convenience) and then actually fetch it,
  # landing on a benign-but-confusing 404 (nothing is routed at "/" there)
  # - a real client/browser would stop and read `code` off that URL instead
  # of requesting it, which is exactly what oauth_exchange_code_2 below
  # does with the final hop's Location instead of ever calling it. If
  # select_account had rendered "Continue as X" instead of auto-continuing,
  # this chain would have stopped early at a 200 page under
  # /authflow/v2/select_account instead of reaching consent - so completing
  # this chain down to a real authorization code proves no page was shown.
  - name: authorize_2
    action: http_request
    http_request_method: GET
    http_request_url: http://127.0.0.1:4000/oauth2/authorize
    http_request_follow_redirects: false
    http_request_query:
      response_type: code
      client_id: e2e
      redirect_uri: http://localhost:4000
      code_challenge_method: S256
      code_challenge: _KHfZq_nzdUr8mdstm_JWKdzbxQIeCW-pKjxf9IJEnc
      scope: "openid offline_access https://authgear.com/scopes/full-access"
      id_token_hint: "{{ .steps.oauth_exchange_code_1.result.raw_id_token }}"
    http_output:
      http_status: 302

  # /oauth2/authorize redirects to the webapp's own entrypoint, which
  # resolves the OAuth session and (a couple of internal hops later, none of
  # them specific to select_account) lands on select_account's resolved
  # login flow auto-continuing straight through to /oauth2/consent, already
  # carrying the authorization code since consent was previously granted.
  - name: webapp_entrypoint
    action: http_request
    http_request_method: GET
    http_request_url: "{{ .steps.authorize_2.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  - name: webapp_entrypoint_2
    action: http_request
    http_request_method: GET
    http_request_url: "http://{{ (urlParse .steps.authorize_2.result.http_response_headers.location).host }}{{ .steps.webapp_entrypoint.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  - name: webapp_entrypoint_3
    action: http_request
    http_request_method: GET
    http_request_url: "http://{{ (urlParse .steps.authorize_2.result.http_response_headers.location).host }}{{ .steps.webapp_entrypoint_2.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  - name: webapp_entrypoint_4
    action: http_request
    http_request_method: GET
    http_request_url: "http://{{ (urlParse .steps.authorize_2.result.http_response_headers.location).host }}{{ .steps.webapp_entrypoint_3.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  # This lands on /oauth2/consent, already carrying the authorization code
  # (consent was auto-approved since it was granted in the first login).
  # Its own redirect (303) is the client's real redirect_uri with the code -
  # capture it below without ever fetching it.
  - name: consent
    action: http_request
    http_request_method: GET
    http_request_url: "{{ .steps.webapp_entrypoint_4.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 303

  - name: oauth_exchange_code_2
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "H8ZPD~2mS4BtiJwzd6fudpzZktJxod.3WA1Oz9l0~uccW9Gjux4FiRitWlhX_PEU"
    oauth_exchange_code_redirect_uri: "{{ .steps.consent.result.http_response_headers.location }}"
    output:
      result: |
        {
          "id_token": {
            "sub": "[[string]]"
          }
        }

  # user.authenticated should fire once per login (twice total), with the
  # second one carrying continue_from_session - proving the auto-continue
  # path reused the existing session rather than rotating it, exactly like
  # the button-driven "continue" path does.
  - name: verify_event_count
    action: audit_query
    audit_query: |
      SELECT activity_type
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
        AND activity_type = 'user.authenticated'
      ORDER BY created_at
    audit_query_output:
      rows: |
        [
          {
            "activity_type": "user.authenticated"
          },
          {
            "activity_type": "user.authenticated"
          }
        ]
  - name: verify_continue_from_session
    action: audit_query
    audit_query: |
      SELECT data->'payload'->'continue_from_session' AS continue_from_session
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
        AND activity_type = 'user.authenticated'
        AND data->'payload'->'continue_from_session' IS NOT NULL
      LIMIT 1
    audit_query_output:
      rows: |
        [
          {
            "continue_from_session": "[[object]]"
          }
        ]
