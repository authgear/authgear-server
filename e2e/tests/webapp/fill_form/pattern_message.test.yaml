name: The fill_form page shows the developer's message for a failed pattern
extra_files_directory: ./var_pattern_message
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    identity:
      login_id:
        keys:
        - key: username
          type: username
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_employee_id
          type: string
          pattern: "^E[0-9]{5}$"
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            fields:
            - user_profile:
                pointer: /x_employee_id
                required: true
steps:
  - name: oauth_setup
    action: oauth_setup
  - name: get_signup_page
    action: http_request
    http_request_method: GET
    http_request_url: http://127.0.0.1:4000/signup?{{ .steps.oauth_setup.result.query }}&q_login_id_key=username&q_login_id_input_type=text
    http_output:
      http_status: 200
      redirect_path: /signup
  - name: submit_signup_id
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.get_signup_page.result.http_final_url }}"
    http_request_form_urlencoded_body:
      q_login_id_key: username
      q_login_id: webapp_pattern_user
      x_action: login_id
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/create_password
  - name: submit_password
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.submit_signup_id.result.http_final_url }}"
    http_request_form_urlencoded_body:
      x_password: password
      x_confirm_password: password
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/fill_form
      html_text_not_contains:
        - Start with E, then 5 digits
  - name: pattern_fails
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.submit_password.result.http_final_url }}"
    http_request_form_urlencoded_body:
      x_action: submit
      "/x_employee_id": "12345"
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/fill_form
      html_text_contains:
        - Start with E, then 5 digits
  - name: pattern_passes
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.pattern_fails.result.http_final_url }}"
    http_request_follow_redirects: false
    http_request_form_urlencoded_body:
      x_action: submit
      "/x_employee_id": "E12345"
    http_output:
      http_status: 302
  - name: finish_flow
    action: http_request
    http_request_method: GET
    http_request_url: "http://127.0.0.1:4000{{ .steps.pattern_passes.result.http_response_headers.location }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 302
  - action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.finish_flow.result.http_response_headers.location }}"
    output:
      result: |
        {
          "id_token": {
            "sub": "[[string]]"
          }
        }
