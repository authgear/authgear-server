name: The fill_form page shows the messages of the form hook
extra_files_directory: ./var
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    identity:
      login_id:
        keys:
        - key: username
          type: username
    hook:
      blocking_handlers:
      - event: authentication.form.post_submitted
        url: authgeardeno:///deno/formcheckemployee.ts
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_employee_id
          type: string
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: employee
            fields:
            - user_profile:
                pointer: /x_employee_id
                required: true
steps:
  - name: oauth_setup
    action: oauth_setup
  - name: get_signup_page
    action: http_request
    http_request_method: GET
    http_request_url: http://127.0.0.1:4000/signup?{{ .steps.oauth_setup.result.query }}&q_login_id_key=username&q_login_id_input_type=text
    http_output:
      http_status: 200
      redirect_path: /signup
  - name: submit_signup_id
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.get_signup_page.result.http_final_url }}"
    http_request_form_urlencoded_body:
      q_login_id_key: username
      q_login_id: webapp_form_user
      x_action: login_id
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/create_password
  - name: submit_password
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.submit_signup_id.result.http_final_url }}"
    http_request_form_urlencoded_body:
      x_password: password
      x_confirm_password: password
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/fill_form
      html_text_contains:
        - Complete your profile
  - name: submit_rejected_value
    action: http_request
    http_request_method: POST
    http_request_url: "{{ .steps.submit_password.result.http_final_url }}"
    http_request_form_urlencoded_body:
      x_action: submit
      "/x_employee_id": E99999
    http_output:
      http_status: 200
      redirect_path: /authflow/v2/fill_form
      html_text_contains:
        - Unknown employee
        - E99999
