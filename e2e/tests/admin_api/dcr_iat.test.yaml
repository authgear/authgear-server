name: Revoke initial access token removes it from listing
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: {}) {
            token
            initialAccessToken {
              id
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]",
              "initialAccessToken": {
                "id": "[[string]]"
              }
            }
          },
          "errors": null
        }
  - name: get_iat_row
    action: query
    query: |
      SELECT id FROM _auth_oauth_initial_access_token
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "id": "[[string]]"
          }
        ]
  - name: revoke_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation($id: ID!) {
          revokeInitialAccessToken(input: { id: $id }) {
            ok
          }
        }
      variables: |
        {
          "id": "{{ nodeID "InitialAccessToken" (index .steps.get_iat_row.result.rows 0).id }}"
        }
    admin_api_output:
      result: |
        {
          "data": {
            "revokeInitialAccessToken": {
              "ok": true
            }
          },
          "errors": null
        }
  - name: verify_removed_from_list
    action: admin_api_graphql
    admin_api_request:
      query: |
        query {
          initialAccessTokens {
            id
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "initialAccessTokens": []
          },
          "errors": null
        }
  - name: verify_removed_from_db
    action: query
    query: |
      SELECT id FROM _auth_oauth_initial_access_token
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        []

