name: Create initial access token with explicit expiresIn
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: { expiresIn: 120 }) {
            token
            initialAccessToken {
              id
              createdAt
              expiresAt
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]",
              "initialAccessToken": {
                "id": "[[string]]",
                "createdAt": "[[string]]",
                "expiresAt": "[[string]]"
              }
            }
          },
          "errors": null
        }
  - name: verify_expires_in
    action: query
    query: |
      SELECT extract(epoch FROM (expires_at - created_at))::int AS diff_seconds
      FROM _auth_oauth_initial_access_token
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "diff_seconds": 120
          }
        ]

