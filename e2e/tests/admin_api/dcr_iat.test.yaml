name: List initial access tokens does not expose the plaintext token
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: {}) {
            token
            initialAccessToken {
              id
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]",
              "initialAccessToken": {
                "id": "[[string]]"
              }
            }
          },
          "errors": null
        }
  - name: get_iat_row
    action: query
    query: |
      SELECT id FROM _auth_oauth_initial_access_token
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "id": "[[string]]"
          }
        ]
  - name: list_tokens
    action: admin_api_graphql
    admin_api_request:
      query: |
        query {
          initialAccessTokens {
            id
            createdAt
            expiresAt
            type
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "initialAccessTokens": [
              {
                "id": "[[string]]",
                "createdAt": "[[string]]",
                "expiresAt": "[[string]]",
                "type": "THIRD_PARTY"
              }
            ]
          },
          "errors": null
        }
  - name: list_tokens_token_field_rejected
    action: admin_api_graphql
    admin_api_request:
      query: |
        query {
          initialAccessTokens {
            id
            token
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": null,
          "errors": [
            {
              "extensions": {
                "errorName": "",
                "reason": ""
              }
            }
          ]
        }
  - name: node_lookup_token_field_rejected
    action: admin_api_graphql
    admin_api_request:
      query: |
        query($id: ID!) {
          node(id: $id) {
            id
            ... on InitialAccessToken {
              token
            }
          }
        }
      variables: |
        {
          "id": "{{ nodeID "InitialAccessToken" (index .steps.get_iat_row.result.rows 0).id }}"
        }
    admin_api_output:
      result: |
        {
          "data": null,
          "errors": [
            {
              "extensions": {
                "errorName": "",
                "reason": ""
              }
            }
          ]
        }

