name: Create third-party initial access token by default
steps:
  - name: create_iat
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createInitialAccessToken(input: {}) {
            token
            initialAccessToken {
              id
              createdAt
              expiresAt
              type
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "createInitialAccessToken": {
              "token": "[[string]]",
              "initialAccessToken": {
                "id": "[[string]]",
                "createdAt": "[[string]]",
                "expiresAt": "[[string]]",
                "type": "THIRD_PARTY"
              }
            }
          },
          "errors": null
        }
  - name: verify_token_format
    action: query
    query: |
      SELECT
        '{{ .steps.create_iat.result.data.createInitialAccessToken.token }}' LIKE 'iat_tp_%' AS has_correct_prefix,
        length('{{ .steps.create_iat.result.data.createInitialAccessToken.token }}') AS token_length
    query_output:
      rows: |
        [
          {
            "has_correct_prefix": true,
            "token_length": 29
          }
        ]
  - name: verify_stored_type
    action: query
    query: |
      SELECT token_type
      FROM _auth_oauth_initial_access_token
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "token_type": "THIRD_PARTY"
          }
        ]

