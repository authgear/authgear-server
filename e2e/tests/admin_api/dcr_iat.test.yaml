name: Revoke initial access token with a different node type ID returns error
steps:
  - name: revoke_wrong_type
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation($id: ID!) {
          revokeInitialAccessToken(input: { id: $id }) {
            ok
          }
        }
      variables: |
        {
          "id": "{{ nodeID "Resource" "00000000-0000-0000-0000-000000000000" }}"
        }
    admin_api_output:
      result: |
        {
          "data": null,
          "errors": [
            {
              "extensions": {
                "errorName": "Invalid"
              }
            }
          ]
        }
