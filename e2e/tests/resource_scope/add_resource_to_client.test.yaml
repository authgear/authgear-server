name: Add Resource To Client
before:
  - type: custom_sql
    custom_sql:
      path: simple_fixtures.sql
steps:
  - action: admin_api_graphql
    admin_api_request:
      query: |
        mutation AddResourceToClientID {
          addResourceToClientID(input: {
            clientID: "e2em2mclient",
            resourceURI: "https://fixtureresource/1"
          }) {
            resource {
              id
              name
              resourceURI
            }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": {
            "addResourceToClientID": {
              "resource": {
                "id": "[[string]]",
                "name": "Fixture Resource 1",
                "resourceURI": "https://fixtureresource/1"
              }
            }
          },
          "errors": null
        }
  - action: admin_api_graphql
    admin_api_request:
      query: |
        query ResourcesByClient {
          resources(clientID: "e2em2mclient") {
            edges {
              node {
                id
                name
                resourceURI
              }
            }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": {
            "resources": {
              "edges": [
                {
                  "node": {
                    "id": "[[string]]",
                    "name": "Fixture Resource 1",
