name: Add Resource To Client - rejected for a client that cannot use client_credentials
before:
  - type: custom_sql
    custom_sql:
      path: simple_fixtures.sql
steps:
  - action: admin_api_graphql
    admin_api_request:
      query: |
        mutation AddResourceToClientID {
          addResourceToClientID(input: {
            clientID: "e2e",
            resourceURI: "https://fixtureresource/1"
          }) {
            resource {
              id
              name
              resourceURI
            }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": null,
          "errors": [
            {
              "extensions": {
                "reason": "ClientCannotBeAssociatedWithResource"
              }
            }
          ]
        }
