name: A custom SMS provider from authgear.secrets.yaml is refused on a loopback address
# The counterpart to env_gateway_is_reached. Same flow, same loopback gateway,
# and the only difference is where the URL came from: sms.custom in
# authgear.secrets.yaml, which a project admin writes. That one stays bound by
# the fetch address policy, so the request must never leave the process.
#
# Without this case, exempting SMS_GATEWAY_CUSTOM_URL could have exempted every
# custom SMS provider and the suite would not notice.
authgear.yaml:
  override: |
    messaging:
      sms_gateway:
        use_config_from: authgear.secrets.yaml
        provider: custom
authgear.features.yaml:
  override: |
    http:
      insecure_fetch_address_allowed: false
    test_mode:
      sms:
        suppressed: false
steps:
  - name: create
    action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }

  - name: identify phone
    action: input
    input: |
      {
        "identification": "phone",
        "login_id": "+6591231502"
      }

  - name: the send is refused before it leaves the process
    action: input
    input: |
      {
        "channel": "sms"
      }
    output:
      error: |
        {
          "name": "InternalError"
        }

  - name: wait for a delivery that must not happen
    action: sleep
    sleep_for: 2s

  - name: no sms was sent
    action: audit_query
    audit_query: |
      SELECT activity_type
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
        AND activity_type IN ('sms.sent', 'sms.suppressed')
      ORDER BY activity_type
    audit_query_output:
      rows: |
        []
