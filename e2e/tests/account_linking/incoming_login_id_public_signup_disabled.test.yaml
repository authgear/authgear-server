name: Account linking - Incoming Login ID - public signup disabled - links to existing OAuth user
authgear.yaml:
  override: |
    authentication:
      public_signup_disabled: true
      identities:
        - login_id
        - oauth
    identity:
      login_id:
        keys:
        - type: email
        - type: username
      oauth:
        providers:
          - alias: google
            client_id: "google"
            type: google
    account_linking:
      login_id:
        - key: email
          action: login_and_link
          user_profile:
            pointer: "/email"
    authentication_flow:
      signup_login_flows:
        - name: f1
          steps:
            - type: identify
              one_of:
              - identification: email
                signup_flow: f1
                login_flow: f1
              - identification: oauth
                signup_flow: f1
                login_flow: f1
      signup_flows:
        - name: f1
          steps:
            - type: identify
              one_of:
              - identification: email
              - identification: oauth
      login_flows:
        - name: f1
          steps:
          - name: identify
            type: identify
            one_of:
            - identification: oauth
            - identification: email
              steps:
              - type: authenticate
                one_of:
                - authentication: primary_password
before:
  - type: user_import
    user_import: google_user.json
  - type: custom_sql
    custom_sql:
      path: google_user.sql
steps:
  - action: "create"
    input: |
      {
        "type": "signup_login",
        "name": "f1"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  # The email is not a login ID yet, so the flow switches to signup.
  # It must reach account linking instead of failing with AuthenticationFlowNoPublicSignup.
  - action: input
    input: |
      {
        "identification": "email",
        "login_id": "mock@example.com"
      }
    output:
      result: |
        {
          "type": "signup",
          "action": {
            "type": "identify",
            "identification": "email",
            "data": {
              "type": "account_linking_identification_data"
            }
          }
        }

  - action: input
    input: |
      {
        "index": 0,
        "redirect_uri": "http://mock"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify",
            "identification": "oauth",
            "data": {
              "type": "oauth_data",
              "alias": "google",
              "oauth_authorization_url": "[[string]]"
            }
          }
        }

  - action: oauth_redirect
    to: "{{ .prev.result.action.data.oauth_authorization_url }}"
    redirect_uri: http://mock
    output:
      result: |
        {
          "query": "[[string]]"
        }

  - action: input
    input: |
      {
        "query": "{{ .prev.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT
        (SELECT COUNT(*) FROM _auth_user WHERE app_id = '{{ .AppID }}') AS user_count,
        (
          SELECT COUNT(*)
          FROM _auth_identity_login_id l
          JOIN _auth_identity i ON i.id = l.id
          WHERE i.app_id = '{{ .AppID }}'
            AND l.login_id = 'mock@example.com'
            AND i.user_id = (SELECT user_id FROM _auth_identity WHERE id = '{{ .AppID }}__google__')
        ) AS linked_email_count
    query_output:
      rows: |
        [
          {
            "user_count": "1",
            "linked_email_count": "1"
          }
        ]
---
name: Account linking - Incoming Login ID - public signup disabled - no existing user
authgear.yaml:
  override: |
    authentication:
      public_signup_disabled: true
      identities:
        - login_id
    identity:
      login_id:
        keys:
        - type: email
    authentication_flow:
      signup_login_flows:
        - name: f1
          steps:
            - type: identify
              one_of:
              - identification: email
                signup_flow: f1
                login_flow: f1
      signup_flows:
        - name: f1
          steps:
            - type: identify
              name: identify_email
              one_of:
              - identification: email
            - type: verify
              target_step: identify_email
      login_flows:
        - name: f1
          steps:
          - type: identify
            one_of:
            - identification: email
              steps:
              - type: authenticate
                one_of:
                - authentication: primary_password
steps:
  - action: "create"
    input: |
      {
        "type": "signup_login",
        "name": "f1"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  # Rejected on the email input itself, before the verify step could send an OTP.
  - action: input
    input: |
      {
        "identification": "email",
        "login_id": "nobody@example.com"
      }
    output:
      error: |
        {
          "reason": "AuthenticationFlowNoPublicSignup"
        }

  - action: query
    query: |
      SELECT COUNT(*) AS user_count FROM _auth_user WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "user_count": "0"
          }
        ]
