name: insecure_http_allowed alone is not enough -- the address filter still refuses a loopback target, and the document server is never contacted
authgear.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        enabled: true
authgear.features.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        insecure_http_allowed: true
steps:
  - name: configure_document
    action: http_request
    http_request_method: POST
    http_request_url: http://localhost:2727/_control/set
    http_request_body: |
      {
        "path": "strict-rejects-private-address-valid.json",
        "document": {
          "client_id": "http://localhost:2727/strict-rejects-private-address-valid.json",
          "redirect_uris": ["http://127.0.0.1:3000/callback"]
        }
      }
    http_output:
      http_status: 200

  # The scheme now passes shape validation (insecure_http_allowed is set),
  # and allowed_domains is empty so the host passes domain-trust too -- but
  # "localhost" resolves to a loopback address, and
  # insecure_fetch_address_allowed is NOT set. This is the composition case:
  # the address filter, not the scheme rule, is what actually stops SSRF.
  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/strict-rejects-private-address-valid.json
      response_type: code
      redirect_uri: http://127.0.0.1:3000/callback
      scope: openid
    http_request_follow_redirects: false
    http_output:
      http_status: 400
      html_text_contains:
        - unauthorized_client

  - name: verify_no_fetch
    action: http_request
    http_request_method: GET
    http_request_url: http://localhost:2727/_control/hits?path=strict-rejects-private-address-valid.json
    http_output:
      http_status: 200
      json_body: |
        {
          "hits": 0
        }
