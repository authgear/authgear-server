name: a large but within-limit document resolves normally, end to end
authgear.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        enabled: true
authgear.features.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        insecure_http_allowed: true
        insecure_fetch_address_allowed: true
steps:
  # A ~4KB response body, well under MaxDocumentBytes (5120, unit-tested
  # precisely at the byte boundary in fetcher_test.go) but far larger than
  # every other CIMD fixture document in this suite -- the "padding" field
  # is unknown to rawDocument (document.go) and is silently dropped, but
  # its bytes still count toward the size read before that ever happens.
  - name: configure_large_document
    action: http_request
    http_request_method: POST
    http_request_url: http://localhost:2727/_control/set
    http_request_body: |
      {
        "path": "large-response-{{ .AppID }}.json",
        "document": {
          "client_id": "http://localhost:2727/large-response-{{ .AppID }}.json",
          "client_name": "Large Document Client",
          "redirect_uris": ["http://127.0.0.1:3000/callback"],
          "padding": ""
        }
      }
    http_output:
      http_status: 200

  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/large-response-{{ .AppID }}.json
      response_type: code
      redirect_uri: http://127.0.0.1:3000/callback
      scope: openid
      code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      code_challenge_method: S256
    http_request_follow_redirects: false
    http_output:
      http_status: 302

  - name: verify_client_created
    action: admin_api_graphql
    admin_api_request:
      query: |
        query {
          dynamicClients {
            totalCount
            edges {
              node {
                clientID
                clientName
              }
            }
          }
        }
      variables: |
        {}
    admin_api_output:
      result: |
        {
          "data": {
            "dynamicClients": {
              "totalCount": 1,
              "edges": [
                {
                  "node": {
                    "clientID": "http://localhost:2727/large-response-{{ .AppID }}.json",
                    "clientName": "Large Document Client"
                  }
                }
              ]
            }
          },
          "errors": null
        }
