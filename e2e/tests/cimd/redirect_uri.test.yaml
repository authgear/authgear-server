name: redirect_uri is validated against the resolved document's redirect_uris
authgear.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        enabled: true
authgear.features.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        insecure_http_allowed: true
        insecure_fetch_address_allowed: true
steps:
  - name: configure_document
    action: http_request
    http_request_method: POST
    http_request_url: http://localhost:2727/_control/set
    http_request_body: |
      {
        "path": "redirect-uri.json",
        "document": {
          "client_id": "http://localhost:2727/redirect-uri.json",
          "redirect_uris": ["http://127.0.0.1:3000/callback", "http://localhost:3000/callback"]
        }
      }
    http_output:
      http_status: 200

  # A redirect_uri not in the document is refused.
  - name: authorize_disallowed
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/redirect-uri.json
      response_type: code
      redirect_uri: http://127.0.0.1:9999/not-registered
      scope: openid
    http_request_follow_redirects: false
    http_output:
      http_status: 400
      html_text_contains:
        - redirect URI is not allowed

  # A loopback redirect_uri from the document, with no application_type
  # declared anywhere (defaults to "web"), is accepted -- the MCP reference
  # shape (docs/specs/cimd.md § UC1).
  - name: authorize_allowed_loopback
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/redirect-uri.json
      response_type: code
      redirect_uri: http://localhost:3000/callback
      scope: openid
      code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      code_challenge_method: S256
    http_request_follow_redirects: false
    http_output:
      http_status: 302
