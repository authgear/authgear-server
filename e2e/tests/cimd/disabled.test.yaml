name: CIMD disabled gives the ordinary unknown-client error, and no fetch is attempted
steps:
  - name: configure_document
    action: http_request
    http_request_method: POST
    http_request_url: http://localhost:2727/_control/set
    http_request_body: |
      {
        "path": "disabled.json",
        "document": {
          "client_id": "http://localhost:2727/disabled.json",
          "redirect_uris": ["http://127.0.0.1:3000/callback"]
        }
      }
    http_output:
      http_status: 200

  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/disabled.json
      response_type: code
      redirect_uri: http://127.0.0.1:3000/callback
      scope: openid
    http_request_follow_redirects: false
    http_output:
      http_status: 400
      html_text_contains:
        - unauthorized_client

  - name: verify_no_fetch
    action: http_request
    http_request_method: GET
    http_request_url: http://localhost:2727/_control/hits?path=disabled.json
    http_output:
      http_status: 200
      json_body: |
        {
          "hits": 0
        }
