        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: view_consent_page
    action: http_request
