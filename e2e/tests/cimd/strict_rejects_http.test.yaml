name: A project with no CIMD feature flags refuses an http:// client_id, and the document server is never contacted
authgear.yaml:
  override: |
    oauth:
      client_id_metadata_document:
        enabled: true
steps:
  - name: configure_document
    action: http_request
    http_request_method: POST
    http_request_url: http://localhost:2727/_control/set
    http_request_body: |
      {
        "path": "strict-rejects-http-valid.json",
        "document": {
          "client_id": "http://localhost:2727/strict-rejects-http-valid.json",
          "redirect_uris": ["http://127.0.0.1:3000/callback"]
        }
      }
    http_output:
      http_status: 200

  # insecure_http_allowed defaults off: the client_id is refused by shape
  # validation (Part 1) before any fetch is attempted, so this proves the
  # flag really is load-bearing, not merely documented.
  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: http://localhost:2727/strict-rejects-http-valid.json
      response_type: code
      redirect_uri: http://127.0.0.1:3000/callback
      scope: openid
    http_request_follow_redirects: false
    http_output:
      http_status: 400
      html_text_contains:
        - unauthorized_client

  - name: verify_no_fetch
    action: http_request
    http_request_method: GET
    http_request_url: http://localhost:2727/_control/hits?path=strict-rejects-http-valid.json
    http_output:
      http_status: 200
      json_body: |
        {
          "hits": 0
        }
