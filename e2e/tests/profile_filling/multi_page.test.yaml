name: Consecutive fill_form steps are separate pages (UC3)
authgear.yaml:
  override: |
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_plan
          type: enum
          enum: [free, pro]
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: page1
            fields:
            - user_profile:
                pointer: /given_name
        - type: fill_form
          form:
            name: page2
            fields:
            - user_profile:
                pointer: /x_plan
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "name": "page1"
              }
            }
          }
        }

  # The input of page 1 is also valid for page 2.
  # It must not be taken by page 2, which is shown instead.
  - name: page_1_submitted_empty
    action: input
    input: |
      {
        "fields": []
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "name": "page2",
                "fields": [
                  {
                    "key": "/x_plan",
                    "type": "enum",
                    "label": "X Plan",
                    "required": false,
                    "options": [
                      { "value": "free", "label": "Free" },
                      { "value": "pro", "label": "Pro" }
                    ]
                  }
                ]
              }
            }
          }
        }

  - name: page_2_submitted_empty
    action: input
    input: |
      {
        "fields": []
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT standard_attributes ? 'given_name' AS has_given_name, custom_attributes ? '0000' AS has_plan
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "has_given_name": false,
            "has_plan": false
          }
        ]
