name: A fill_form step after select_account
authgear.yaml:
  override: |
    authentication_flow:
      login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: select_account
        - type: fill_form
          form:
            fields:
            - user_profile:
                pointer: /given_name
before:
  - type: user_import
    user_import: select_account_users.json
  - type: create_session
    create_session:
      session_type: idp
      session_id: e2e-fill-form-select-account-1
      token: e2efillformselectaccounttoken1
      select_user_id_sql: |
        SELECT id FROM _auth_user u
          WHERE u.app_id = '{{ .AppID }}' AND
          u.standard_attributes ->> 'preferred_username' = 'e2e_select_account';
steps:
  - action: create
    session_cookie:
      idp_session_id: e2e-fill-form-select-account-1
      idp_session_token: e2efillformselectaccounttoken1
    input: |
      {
        "type": "login",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    session_cookie:
      idp_session_id: e2e-fill-form-select-account-1
      idp_session_token: e2efillformselectaccounttoken1
    input: |
      {
        "identification": "select_account",
        "index": 0
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "fields": [
                  {
                    "key": "/given_name",
                    "required": false,
                    "value": "Selected"
                  }
                ]
              }
            }
          }
        }

  - action: input
    session_cookie:
      idp_session_id: e2e-fill-form-select-account-1
      idp_session_token: e2efillformselectaccounttoken1
    input: |
      {
        "fields": [
          { "key": "/given_name", "value": "Changed" }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT standard_attributes->>'preferred_username' AS username, standard_attributes->>'given_name' AS given_name
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
      ORDER BY standard_attributes->>'preferred_username'
    query_output:
      rows: |
        [
          {
            "username": "e2e_select_account",
            "given_name": "Changed"
          },
          {
            "username": "e2e_select_account_2",
            "given_name": "Selected"
          }
        ]
