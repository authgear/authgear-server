name: A required address in a flow for a different application (UC5)
authgear.yaml:
  override: |
    user_profile:
      standard_attributes:
        access_control:
        - pointer: /address
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: store
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            fields:
            - user_profile:
                pointer: /address
                required: true
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "store"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "fields": [
                  {
                    "key": "/address",
                    "type": "address",
                    "label": "Address",
                    "required": true
                  }
                ]
              }
            }
          }
        }

  - name: empty_address
    action: input
    input: |
      {
        "fields": [
          { "key": "/address", "value": {} }
        ]
      }
    output:
      error: |
        {
          "reason": "ValidationFailed"
        }

  - name: unknown_sub_attribute
    action: input
    input: |
      {
        "fields": [
          { "key": "/address", "value": { "foo": "x" } }
        ]
      }
    output:
      error: |
        {
          "reason": "ValidationFailed"
        }

  - action: input
    input: |
      {
        "fields": [
          {
            "key": "/address",
            "value": {
              "street_address": "1 Main Street",
              "locality": "Central",
              "country": "HK"
            }
          }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT standard_attributes->'address' AS address
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "address": {
              "street_address": "1 Main Street",
              "locality": "Central",
              "country": "HK"
            }
          }
        ]
