name: A named form can override the label of a field
extra_files_directory: ./var_translations
authgear.yaml:
  override: |
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_terms
          type: boolean
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
        - id: "0001"
          pointer: /x_newsletter
          type: boolean
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: consent
            fields:
            - user_profile:
                pointer: /x_terms
                required: true
            - user_profile:
                pointer: /x_newsletter
        - type: fill_form
          form:
            fields:
            - user_profile:
                pointer: /x_newsletter
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - name: named_form_uses_form_field_label
    action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "name": "consent",
                "fields": [
                  {
                    "key": "/x_terms",
                    "type": "boolean",
                    "label": "I accept the <a href=\"https://example.com/terms\" target=\"_blank\" rel=\"noopener noreferrer\">Terms</a>",
                    "required": true
                  },
                  {
                    "key": "/x_newsletter",
                    "type": "boolean",
                    "label": "Send me news. See our <a href=\"https://example.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy Policy</a>.",
                    "required": false
                  }
                ]
              }
            }
          }
        }

  - name: unnamed_form_uses_attribute_label
    action: input
    input: |
      {
        "fields": [
          { "key": "/x_terms", "value": true },
          { "key": "/x_newsletter", "value": true }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "fields": [
                  {
                    "key": "/x_newsletter",
                    "type": "boolean",
                    "label": "X Newsletter",
                    "required": false,
                    "value": true
                  }
                ]
              }
            }
          }
        }

  - action: input
    input: |
      {
        "fields": [
          { "key": "/x_newsletter", "value": false }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }
