name: signup_login continues into a signup whose branch has a form
authgear.yaml:
  override: |
    authentication_flow:
      signup_login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            signup_flow: default
            login_flow: default
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            form:
              name: names
              fields:
              - user_profile:
                  pointer: /given_name
                  required: true
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
      login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: authenticate
              one_of:
              - authentication: primary_password
steps:
  - action: create
    input: |
      {
        "type": "signup_login",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify",
            "data": {
              "options": [
                {
                  "identification": "username",
                  "form": "[[never]]"
                }
              ]
            }
          }
        }

  # The login ID is already entered, so the form is its own page.
  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_new_user"
      }
    output:
      result: |
        {
          "type": "signup",
          "action": {
            "type": "fill_form",
            "data": {
              "type": "fill_form_data",
              "form": {
                "name": "names",
                "fields": [
                  {
                    "key": "/given_name",
                    "required": true
                  }
                ]
              }
            }
          }
        }

  - action: input
    input: |
      {
        "fields": [
          { "key": "/given_name", "value": "John" }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT standard_attributes->>'given_name' AS given_name
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "given_name": "John"
          }
        ]
