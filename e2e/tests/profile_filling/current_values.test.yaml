name: A form shows the current value, and an omitted optional field is cleared (UC6)
authgear.yaml:
  override: |
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            name: first
            fields:
            - user_profile:
                pointer: /given_name
        - type: fill_form
          form:
            name: second
            fields:
            - user_profile:
                pointer: /given_name
            - user_profile:
                pointer: /family_name
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "name": "first",
                "fields": [
                  {
                    "key": "/given_name",
                    "value": "[[never]]"
                  }
                ]
              }
            }
          }
        }

  - action: input
    input: |
      {
        "fields": [
          { "key": "/given_name", "value": "John" }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "name": "second",
                "fields": [
                  {
                    "key": "/given_name",
                    "value": "John"
                  },
                  {
                    "key": "/family_name",
                    "value": "[[never]]"
                  }
                ]
              }
            }
          }
        }

  # given_name is omitted, so it is cleared.
  - action: input
    input: |
      {
        "fields": [
          { "key": "/family_name", "value": "Doe" }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT standard_attributes ? 'given_name' AS has_given_name, standard_attributes->>'family_name' AS family_name
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "has_given_name": false,
            "family_name": "Doe"
          }
        ]
