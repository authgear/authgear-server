name: Boolean attributes, such as agreeing to terms (UC8)
extra_files_directory: ./var_translations
authgear.yaml:
  override: |
    user_profile:
      custom_attributes:
        attributes:
        - id: "0000"
          pointer: /x_terms
          type: boolean
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
        - id: "0001"
          pointer: /x_newsletter
          type: boolean
          access_control:
            end_user: readwrite
            bearer: readonly
            portal_ui: readwrite
    authentication_flow:
      signup_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
        - type: fill_form
          form:
            fields:
            - user_profile:
                pointer: /x_terms
                required: true
            - user_profile:
                pointer: /x_newsletter
steps:
  - action: create
    input: |
      {
        "type": "signup",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_form_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "create_authenticator"
          }
        }

  - action: input
    input: |
      {
        "authentication": "primary_password",
        "new_password": "e2e_password"
      }
    output:
      result: |
        {
          "action": {
            "type": "fill_form",
            "data": {
              "form": {
                "fields": [
                  {
                    "key": "/x_terms",
                    "type": "boolean",
                    "label": "I accept the <a href=\"https://example.com/terms\" target=\"_blank\" rel=\"noopener noreferrer\">Terms</a>",
                    "required": true
                  },
                  {
                    "key": "/x_newsletter",
                    "type": "boolean",
                    "label": "X Newsletter",
                    "required": false
                  }
                ]
              }
            }
          }
        }

  - name: required_boolean_must_be_true
    action: input
    input: |
      {
        "fields": [
          { "key": "/x_terms", "value": false }
        ]
      }
    output:
      error: |
        {
          "reason": "ValidationFailed"
        }

  - name: required_boolean_missing
    action: input
    input: |
      {
        "fields": [
          { "key": "/x_newsletter", "value": false }
        ]
      }
    output:
      error: |
        {
          "reason": "ValidationFailed"
        }

  - action: input
    input: |
      {
        "fields": [
          { "key": "/x_terms", "value": true },
          { "key": "/x_newsletter", "value": false }
        ]
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }

  - action: query
    query: |
      SELECT custom_attributes->'0000' AS terms, custom_attributes->'0001' AS newsletter
      FROM _auth_user
      WHERE app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "terms": true,
            "newsletter": false
          }
        ]

  - action: audit_query
    audit_query: |
      SELECT data->'payload'->'user'->'custom_attributes' AS custom_attributes
      FROM _audit_log
      WHERE app_id = '{{ .AppID }}'
        AND activity_type = 'user.created'
    audit_query_output:
      rows: |
        [
          {
            "custom_attributes": {
              "x_terms": true,
              "x_newsletter": false
            }
          }
        ]
