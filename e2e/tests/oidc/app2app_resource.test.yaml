name: app2app from a resource-bound refresh token follows the resource parameter
# Without resource, the code app2app issues is not bound to a resource and must
# not carry the resource scopes of the refresh token it was made from. With
# resource, it is bound to it.
authgear.features.yaml:
  override: |
    oauth:
      client:
        app2app_enabled: true
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    oauth:
      clients:
      # The already authenticated app, whose refresh token authorises the
      # app2app request.
      - access_token_lifetime_seconds: 1800
        client_id: e2e
        grant_types:
        - authorization_code
        - refresh_token
        name: authenticated-app
        redirect_uris:
        - http://localhost:4000
        refresh_token_lifetime_seconds: 31449600
        response_types:
        - code
        - none
        x_application_type: spa
        issue_jwt_access_token: true
        x_app2app_enabled: true
        x_app2app_insecure_device_key_binding_enabled: true
      # The app requesting a session of its own.
      - access_token_lifetime_seconds: 1800
        client_id: app2apptarget
        grant_types:
        - authorization_code
        - refresh_token
        name: requesting-app
        redirect_uris:
        - http://localhost:4000/app2app-callback
        refresh_token_lifetime_seconds: 31449600
        response_types:
        - code
        - none
        x_application_type: spa
        issue_jwt_access_token: true
        x_app2app_enabled: true
        x_app2app_insecure_device_key_binding_enabled: true
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/orders",
            scope: "read:orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  # Sign the user in on the authenticated app with a resource-bound grant.
  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_follow_redirects: false
    http_request_query:
      client_id: e2e
      redirect_uri: http://localhost:4000
      response_type: code
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
      scope: "openid offline_access https://authgear.com/scopes/full-access read:orders"
      resource: https://api.example.com/orders
      x_sso_enabled: "false"
    http_output:
      http_status: 302

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ (urlParse .steps.authorize.result.http_response_headers.location).query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_userinfo_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: get_code
    action: http_request
    http_request_method: GET
    http_request_url: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    http_request_follow_redirects: false
    http_output:
      http_status: 303

  - name: exchange_code
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: authorization_code
      client_id: e2e
      redirect_uri: http://localhost:4000
      code_verifier: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
      code: "{{ (urlParse .steps.get_code.result.http_response_headers.location).query | regexFind \"code=[^&]+\" | trimPrefix \"code=\" }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "refresh_token": "[[string]]"
        }

  # App2app without resource: the presented refresh token is bound to the
  # resource, but the new client asks for none.
  - name: challenge
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/challenge
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "purpose": "app2app_request"
      }
    http_output:
      http_status: 200
      json_body: |
        {
          "result": {
            "token": "[[string]]"
          }
        }

  - name: app2app_request
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: urn:authgear:params:oauth:grant-type:app2app-request
      client_id: app2apptarget
      redirect_uri: http://localhost:4000/app2app-callback
      refresh_token: "{{ .steps.exchange_code.result.http_json_body.refresh_token }}"
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
      jwt: "{{ generateApp2AppJWT .steps.challenge.result.http_json_body.result.token }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "code": "[[string]]"
        }

  # The code is not bound to a resource, so the tokens it leads to carry no
  # scope of one.
  - name: redeem_app2app_code
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: authorization_code
      client_id: app2apptarget
      redirect_uri: http://localhost:4000/app2app-callback
      code_verifier: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
      code: "{{ .steps.app2app_request.result.http_json_body.code }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "refresh_token": "[[string]]",
          "scope": "openid offline_access https://authgear.com/scopes/full-access"
        }

  # Only the resource-bound grant of the authenticated app holds read:orders;
  # the requesting app got none.
  - name: authorizations
    action: query
    query: |
      SELECT a.client_id, a.scopes_by_resources->r.id AS resource_scopes
      FROM _auth_oauth_authorization a
      JOIN _auth_resource r ON r.app_id = a.app_id
      WHERE a.app_id = '{{ .AppID }}'
      ORDER BY a.client_id
    query_output:
      rows: |
        [
          {
            "client_id": "app2apptarget",
            "resource_scopes": null
          },
          {
            "client_id": "e2e",
            "resource_scopes": ["read:orders"]
          }
        ]

  # App2app with resource: the code is bound to it and carries the resource
  # scopes both clients are granted.
  - name: challenge_with_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/challenge
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "purpose": "app2app_request"
      }
    http_output:
      http_status: 200
      json_body: |
        {
          "result": {
            "token": "[[string]]"
          }
        }

  - name: app2app_request_with_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: urn:authgear:params:oauth:grant-type:app2app-request
      client_id: app2apptarget
      redirect_uri: http://localhost:4000/app2app-callback
      refresh_token: "{{ .steps.exchange_code.result.http_json_body.refresh_token }}"
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
      jwt: "{{ generateApp2AppJWT .steps.challenge_with_resource.result.http_json_body.result.token }}"
      resource: https://api.example.com/orders
    http_output:
      http_status: 200
      json_body: |
        {
          "code": "[[string]]"
        }

  - name: redeem_app2app_code_with_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: authorization_code
      client_id: app2apptarget
      redirect_uri: http://localhost:4000/app2app-callback
      code_verifier: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
      code: "{{ .steps.app2app_request_with_resource.result.http_json_body.code }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "refresh_token": "[[string]]",
          "scope": "openid offline_access https://authgear.com/scopes/full-access read:orders"
        }

  # The refresh token is bound to the resource.
  - name: refresh_with_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: refresh_token
      client_id: app2apptarget
      refresh_token: "{{ .steps.redeem_app2app_code_with_resource.result.http_json_body.refresh_token }}"
      resource: https://api.example.com/orders
    http_output:
      http_status: 200
      json_body: |
        {
          "access_token": "[[string]]"
        }

  # A resource the presented refresh token is not bound to.
  - name: challenge_other_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/challenge
    http_request_headers:
      Content-Type: application/json
    http_request_body: |
      {
        "purpose": "app2app_request"
      }
    http_output:
      http_status: 200
      json_body: |
        {
          "result": {
            "token": "[[string]]"
          }
        }

  - name: app2app_request_other_resource
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: urn:authgear:params:oauth:grant-type:app2app-request
      client_id: app2apptarget
      redirect_uri: http://localhost:4000/app2app-callback
      refresh_token: "{{ .steps.exchange_code.result.http_json_body.refresh_token }}"
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
      jwt: "{{ generateApp2AppJWT .steps.challenge_other_resource.result.http_json_body.result.token }}"
      resource: https://api.example.com/other
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_target"
        }
