name: Pre-authenticated URL token exchange succeeds when the session holds a resource scope
# The token exchange copies the offline grant's scopes, which here include
# read:orders, as they are. It must still succeed, and must not grant
# read:orders on anything but the resource it was authorized for.
authgear.yaml:
  override: |
    authentication:
      identities:
      - login_id
      primary_authenticators:
      - password
    oauth:
      clients:
      - access_token_lifetime_seconds: 1800
        client_id: e2e
        grant_types:
        - authorization_code
        - refresh_token
        name: reactweb
        redirect_uris:
        - http://localhost:4000
        refresh_token_idle_timeout_enabled: true
        refresh_token_idle_timeout_seconds: 2592000
        refresh_token_lifetime_seconds: 31449600
        response_types:
        - code
        - none
        x_application_type: spa
        issue_jwt_access_token: true
        x_pre_authenticated_url_enabled: true
        x_pre_authenticated_url_allowed_origins:
        - http://localhost:4000
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/orders",
            scope: "read:orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  # device_sso and the pre-authenticated-url scope are what cause the token
  # endpoint to issue a device_secret alongside the tokens.
  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_follow_redirects: false
    http_request_query:
      client_id: e2e
      redirect_uri: http://localhost:4000
      response_type: code
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
      scope: "openid offline_access device_sso https://authgear.com/scopes/pre-authenticated-url https://authgear.com/scopes/full-access read:orders"
      resource: https://api.example.com/orders
      x_sso_enabled: "false"
    http_output:
      http_status: 302

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ (urlParse .steps.authorize.result.http_response_headers.location).query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_userinfo_user"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    output:
      result: |
        {
          "access_token": "[[string]]",
          "refresh_token": "[[string]]",
          "raw_id_token": "[[string]]",
          "device_secret": "[[string]]"
        }

  # Exchange the device_secret and id_token for a pre-authenticated URL token.
  - name: token_exchange
    action: http_request
    http_request_method: POST
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      client_id: e2e
      grant_type: urn:ietf:params:oauth:grant-type:token-exchange
      requested_token_type: urn:authgear:params:oauth:token-type:pre-authenticated-url-token
      audience: http://{{.AppID}}.authgeare2e.localhost:4000
      subject_token_type: urn:ietf:params:oauth:token-type:id_token
      subject_token: "{{ .steps.exchange_code.result.raw_id_token }}"
      actor_token_type: urn:x-oath:params:oauth:token-type:device-secret
      actor_token: "{{ .steps.exchange_code.result.device_secret }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "access_token": "[[string]]",
          "issued_token_type": "urn:authgear:params:oauth:token-type:pre-authenticated-url-token",
          "token_type": "Bearer",
          "id_token": "[[string]]",
          "device_secret": "[[string]]"
        }


  # Using the token issues the browser session's tokens from the same scopes.
  - name: use_pre_authenticated_url
    action: http_request
    http_request_method: GET
    http_request_url: http://{{.AppID}}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_follow_redirects: false
    http_request_query:
      client_id: e2e
      redirect_uri: http://localhost:4000
      response_type: "urn:authgear:params:oauth:response-type:pre-authenticated-url token"
      response_mode: cookie
      prompt: none
      id_token_hint: "{{ .steps.token_exchange.result.http_json_body.id_token }}"
      x_pre_authenticated_url_token: "{{ .steps.token_exchange.result.http_json_body.access_token }}"
    http_output:
      http_status: 303
      location_contains:
        - http://localhost:4000
      location_not_contains:
        - error=

  - name: authorization
    action: query
    query: |
      SELECT a.scopes_by_resources->r.id AS resource_scopes
      FROM _auth_oauth_authorization a
      JOIN _auth_resource r ON r.app_id = a.app_id
      WHERE a.app_id = '{{ .AppID }}'
    query_output:
      rows: |
        [
          {
            "resource_scopes": ["read:orders"]
          }
        ]
