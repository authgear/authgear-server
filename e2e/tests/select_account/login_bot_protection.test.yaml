name: Login via select_account with bot protection required
authgear.yaml:
  override: |
    bot_protection:
      enabled: true
      provider:
        type: cloudflare
        site_key: dummy
    authentication_flow:
      login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: select_account
            bot_protection:
              mode: always
before:
  - type: user_import
    user_import: users.json
  - type: create_session
    create_session:
      session_type: idp
      session_id: e2e-select-account-bp-session-1
      token: e2eselectaccountbpsessiontoken1
      select_user_id_sql: |
        SELECT id FROM _auth_user u
          WHERE u.app_id = '{{ .AppID }}' AND
          u.standard_attributes ->> 'preferred_username' = 'e2e_select_account';
steps:
  - action: "create"
    session_cookie:
      idp_session_id: e2e-select-account-bp-session-1
      idp_session_token: e2eselectaccountbpsessiontoken1
    input: |
      {
        "type": "login",
        "name": "default"
      }
    output:
      result: |
        {
          "state_token": "[[string]]",
          "type": "login",
          "name": "default",
          "action": {
            "type": "identify",
            "data": {
              "options": [
                {
                  "identification": "select_account",
                  "display_name": "e2e_select_account",
                  "bot_protection": {
                    "enabled": true,
                    "provider": {
                      "type": "cloudflare"
                    }
                  }
                }
              ]
            }
          }
        }

  - action: input
    input: |
      {
        "identification": "select_account",
        "index": 0
      }
    output:
      error: |
        {
          "name": "Invalid",
          "reason": "ValidationFailed",
          "message": "invalid value",
          "code": 400,
          "info": {
            "causes": "[[array]]"
          }
        }
---
