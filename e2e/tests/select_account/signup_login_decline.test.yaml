name: SignupLogin declining select_account resolves signup/login as normal
authgear.yaml:
  override: |
    authentication_flow:
      signup_login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: select_account
            login_flow: default_login
          - identification: username
            signup_flow: default_signup
            login_flow: default_login
      signup_flows:
      - name: default_signup
        steps:
        - type: identify
          one_of:
          - identification: username
            steps:
            - type: create_authenticator
              one_of:
              - authentication: primary_password
      login_flows:
      - name: default_login
        steps:
        - type: identify
          one_of:
          - identification: select_account
          - identification: username
            steps:
            - type: authenticate
              one_of:
              - authentication: primary_password
before:
  - type: user_import
    user_import: users.json
  - type: create_session
    create_session:
      session_type: idp
      session_id: e2e-select-account-decline-session-1
      token: e2eselectaccountdeclinesessiontoken1
      select_user_id_sql: |
        SELECT id FROM _auth_user u
          WHERE u.app_id = '{{ .AppID }}' AND
          u.standard_attributes ->> 'preferred_username' = 'e2e_select_account';
steps:
  - action: "create"
    session_cookie:
      idp_session_id: e2e-select-account-decline-session-1
      idp_session_token: e2eselectaccountdeclinesessiontoken1
    input: |
      {
        "type": "signup_login",
        "name": "default"
      }
    output:
      result: |
        {
          "state_token": "[[string]]",
          "type": "signup_login",
          "name": "default",
          "action": {
            "type": "identify",
            "data": {
              "type": "identification_data",
              "options": [
                {
                  "identification": "select_account",
                  "display_name": "e2e_select_account"
                },
                {
                  "identification": "username"
                }
              ]
            }
          }
        }

  - action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_select_account_new"
      }
    output:
      result: |
        {
          "state_token": "[[string]]",
          "type": "signup",
          "name": "default_signup",
          "action": {
            "type": "create_authenticator"
          }
        }
