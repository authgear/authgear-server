name: Login via select_account with step-up TOTP required
authgear.yaml:
  override: |
    authentication_flow:
      login_flows:
      - name: default
        steps:
        - type: identify
          one_of:
          - identification: select_account
            steps:
            - type: authenticate
              one_of:
              - authentication: secondary_totp
before:
  - type: user_import
    user_import: users_totp.json
  - type: create_session
    create_session:
      session_type: idp
      session_id: e2e-select-account-totp-session-1
      token: e2eselectaccounttotpsessiontoken1
      select_user_id_sql: |
        SELECT id FROM _auth_user u
          WHERE u.app_id = '{{ .AppID }}' AND
          u.standard_attributes ->> 'preferred_username' = 'e2e_select_account_totp';
steps:
  - action: "create"
    session_cookie:
      idp_session_id: e2e-select-account-totp-session-1
      idp_session_token: e2eselectaccounttotpsessiontoken1
    input: |
      {
        "type": "login",
        "name": "default"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify",
            "data": {
              "type": "identification_data",
              "options": [
                {
                  "identification": "select_account",
                  "display_name": "e2e_select_account_totp"
                }
              ]
            }
          }
        }

  - action: input
    input: |
      {
        "identification": "select_account",
        "index": 0
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate",
            "data": {
              "type": "authentication_data",
              "options": [
                {
                  "authentication": "secondary_totp"
                }
              ]
            }
          }
        }

  - action: input
    input: |
      {
        "authentication": "secondary_totp",
        "code": "{{ generateTOTPCode "JBSWY3DPEHPK3PXP" }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished"
          }
        }
