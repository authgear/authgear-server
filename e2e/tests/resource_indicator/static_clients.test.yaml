name: Static first-party client requesting a nonexistent Resource also gets invalid_target
# errResourceNotAvailable folds "does not exist" and "policy does not
# admit this client" into the same response, so a client cannot enumerate
# a project's Resources by probing the difference.
steps:
  - name: authorize_with_unknown_resource
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: e2e
      response_type: code
      redirect_uri: http://localhost:4000
      scope: openid
      resource: https://api.example.com/does-not-exist
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
    http_request_follow_redirects: false
    http_output:
      http_status: 303
      location_contains:
        - "error=invalid_target"

---

