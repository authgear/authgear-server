name: Static third-party client is not admitted by a Resource that only grants the dynamic third-party category
# Regression test for the category-classifier interface (model.AccessPolicy.AllowsClient):
# IsThirdParty() alone is true for both e2ethirdparty (static) and a DCR
# client (dynamic), but allow_dynamic_third_party_client_access must only
# ever admit the dynamic one.
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/orders",
            accessPolicy: { allowDynamicThirdPartyClientAccess: true }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: authorize_with_resource
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: e2ethirdparty
      response_type: code
      redirect_uri: http://localhost:4000
      scope: openid
      resource: https://api.example.com/orders
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
    http_request_follow_redirects: false
    http_output:
      http_status: 303
      location_contains:
        - "error=invalid_target"

---

