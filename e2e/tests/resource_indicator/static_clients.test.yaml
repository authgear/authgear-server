name: Static first-party client gets a resource-bound access token
# e2e (x_application_type: spa) is static first-party. Consent is bypassed
# (first-party), so the code comes straight from finish_redirect_uri. Full
# flow: create the Resource/Scope, authorize, exchange the code, and use
# the access token against /oauth2/userinfo.
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/orders",
            scope: "read:orders",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: oauth_setup
    action: oauth_setup
    oauth_setup_client_id: e2e
    oauth_setup_scope:
      - openid
      - read:orders
    oauth_setup_resource: https://api.example.com/orders

  - name: create_flow
    action: create
    input: |
      {
        "type": "login",
        "name": "default",
        "url_query": "{{ .steps.oauth_setup.result.query }}"
      }
    output:
      result: |
        {
          "action": {
            "type": "identify"
          }
        }

  - name: identify
    action: input
    input: |
      {
        "identification": "username",
        "login_id": "e2e_login"
      }
    output:
      result: |
        {
          "action": {
            "type": "authenticate"
          }
        }

  - name: authenticate
    action: input
    input: |
      {
        "authentication": "primary_password",
        "password": "password"
      }
    output:
      result: |
        {
          "action": {
            "type": "finished",
            "data": {
              "finish_redirect_uri": "[[string]]"
            }
          }
        }

  - name: exchange_code
    action: oauth_exchange_code
    oauth_exchange_code_code_verifier: "{{ .steps.oauth_setup.result.code_verifier }}"
    oauth_exchange_code_redirect_uri: "{{ .steps.authenticate.result.action.data.finish_redirect_uri }}"
    oauth_exchange_code_client_id: e2e
    output:
      result: |
        {
          "access_token_is_jwt": true,
          "access_token_claims": {
            "aud": ["https://api.example.com/orders"],
            "scope": "openid read:orders"
          }
        }

  - name: userinfo
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/userinfo
    http_request_headers:
      Authorization: "Bearer {{ .steps.exchange_code.result.access_token }}"
    http_output:
      http_status: 200
      json_body: |
        {
          "sub": "[[string]]"
        }

---

name: Static first-party client requesting a Scope without its own access policy key gets invalid_scope
# The two-level check: the Resource admits the client's category, but the
# Scope does not -- this must fail at /oauth2/authorize, before any code
# is issued, not silently drop the scope.
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/partial",
            accessPolicy: { allowStaticFirstPartyClientAccess: true }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  # No accessPolicy override -> defaults to allowStaticFirstPartyClientAccess: false.
  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/partial",
            scope: "read:partial"
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: authorize_with_disabled_scope
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: e2e
      response_type: code
      redirect_uri: http://localhost:4000
      scope: "openid read:partial"
      resource: https://api.example.com/partial
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
    http_request_follow_redirects: false
    http_output:
      http_status: 303
      location_contains:
        - "error=invalid_scope"

---

