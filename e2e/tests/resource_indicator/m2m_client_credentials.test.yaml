name: M2M client gets a resource-bound access token via client_credentials, end to end
# client_credentials is governed by the explicit Client-Resource
# Association (resourcescope.ClientResourceScopeService), not by
# access_policy at all -- unlike every other grant in this directory. Full
# flow: create the Resource/Scope, associate the m2m client with both via
# the Admin API, then call /oauth2/token directly.
before:
  - type: user_import
    user_import: users.json
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: { resourceURI: "https://api.example.com/orders" }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: create_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createScope(input: {
            resourceURI: "https://api.example.com/orders",
            scope: "read:orders"
          }) {
            scope { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createScope": { "scope": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: associate_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          addResourceToClientID(input: {
            clientID: "e2em2mclient",
            resourceURI: "https://api.example.com/orders"
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "addResourceToClientID": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: associate_scope
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          addScopesToClientID(input: {
            clientID: "e2em2mclient",
            resourceURI: "https://api.example.com/orders",
            scopes: ["read:orders"]
          }) {
            scopes { id scope }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": {
            "addScopesToClientID": {
              "scopes": [
                { "id": "[[string]]", "scope": "read:orders" }
              ]
            }
          },
          "errors": null
        }

  - name: client_credentials
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: client_credentials
      client_id: e2em2mclient
      client_secret: e2esecret
      resource: https://api.example.com/orders
      scope: read:orders
    http_output:
      http_status: 200
      json_body: |
        {
          "access_token": "[[string]]",
          "token_type": "Bearer",
          "scope": "read:orders"
        }

---

name: M2M client with every access_policy key granted but no association still gets invalid_target
# The partition, from the other side of static_clients.test.yaml: access_policy
# is never consulted for client_credentials, only the explicit association --
# so a Resource wide open via every access_policy key must still refuse an
# unassociated m2m client. See docs/specs/api-resource.md § Relationship to
# Client-Resource Association.
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: {
            resourceURI: "https://api.example.com/orders",
            accessPolicy: {
              allowStaticFirstPartyClientAccess: true,
              allowStaticThirdPartyClientAccess: true,
              allowDynamicFirstPartyClientAccess: true,
              allowDynamicThirdPartyClientAccess: true
            }
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: client_credentials
    action: http_request
    http_request_method: POST
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/token
    http_request_form_urlencoded_body:
      grant_type: client_credentials
      client_id: e2em2mclient
      client_secret: e2esecret
      resource: https://api.example.com/orders
    http_output:
      http_status: 400
      json_body: |
        {
          "error": "invalid_target"
        }

---

name: A client that cannot use client_credentials cannot be associated with a Resource
# Regression test for AddResourceToClientID's gate, derived from the same
# OAuthClientApplicationType.IsClientCredentialsFlowAllowed flag as the
# grant-type check itself -- e2e (spa) has never been allowed to use
# client_credentials.
steps:
  - name: create_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          createResource(input: { resourceURI: "https://api.example.com/orders" }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": { "createResource": { "resource": { "id": "[[string]]" } } },
          "errors": null
        }

  - name: associate_resource
    action: admin_api_graphql
    admin_api_request:
      query: |
        mutation {
          addResourceToClientID(input: {
            clientID: "e2e",
            resourceURI: "https://api.example.com/orders"
          }) {
            resource { id }
          }
        }
      variables: "{}"
    admin_api_output:
      result: |
        {
          "data": null,
          "errors": [
            {
              "extensions": {
                "reason": "ClientCannotBeAssociatedWithResource"
              }
            }
          ]
        }

---

name: M2M client cannot use the authorize endpoint at all
# redirect_uri is the AS's own origin, implicitly allowed (validateRedirectURI's
# same-origin rule) even though e2em2mclient has no registered redirect_uris --
# so this reaches validateGrantTypeForResponseType instead of failing on the
# redirect URI first. m2m's only grant is client_credentials, so it lacks
# authorization_code, the grant response_type=code leads to.
steps:
  - name: authorize
    action: http_request
    http_request_method: GET
    http_request_url: http://{{ .AppID }}.authgeare2e.localhost:4000/oauth2/authorize
    http_request_query:
      client_id: e2em2mclient
      response_type: code
      redirect_uri: http://{{ .AppID }}.authgeare2e.localhost:4000
      scope: openid
      code_challenge_method: S256
      code_challenge: RqIZl4LIgn8KxW9QO-nTnv7pf0CnNrksx9fF-CXP2FE
    http_request_follow_redirects: false
    http_output:
      http_status: 303
      location_contains:
        - "error=unauthorized_client"
        - "error_description=this+client%27s+grant+types+do+not+include+authorization_code"
