# The e2e deployment's webhook receivers and hook server run on loopback, which
# is the self-hosted shape http.insecure_fetch_address_allowed exists for. A
# deployment serving projects it does not control leaves this off; see
# tests/hook/ssrf_address_policy for the strict behaviour.
http:
  insecure_fetch_address_allowed: true
test_mode:
  fixed_oob_otp:
    enabled: true
    code: "111111"
  deterministic_link_otp:
    enabled: true
  sms:
    suppressed: true
  whatsapp:
    suppressed: true
fraud_protection:
  is_modifiable: true
