configs:
  - {}
  - messaging:
      whatsapp_usage_count_disabled: true
      custom_sms_provider_disabled: true
  - ui:
      white_labeling:
        disabled: true
  - custom_domain:
      disabled: true
  - oauth:
      client:
        maximum: 2
        soft_maximum: 20
  - oauth:
      client:
        custom_ui_enabled: true
  - collaborator:
      maximum: 3
      soft_maximum: 30
  - messaging:
      sms_usage:
        enabled: true
        period: month
        quota: 5
  - usage:
      hooks:
        - url: https://site.example.com/sms
          match: sms
      limits:
        sms:
          - quota: 4
            period: month
            action: alert
        email:
          - quota: 20
            period: month
            action: alert
  - admin_api:
      create_session_enabled: false
      user_export_usage:
        enabled: false
        period: month
        quota: 1
  - usage:
      hooks:
        - url: https://project.example.com/all
          match: "*"
      limits:
        sms:
          - quota: 8
            period: month
            action: block
  - admin_api:
      user_import_usage:
        enabled: true
        period: day
        quota: 2
  - admin_api:
      create_session_enabled: true
  - hook:
      blocking_handler:
        maximum: 5
  - hook:
      non_blocking_handler:
        maximum: 7
  - ui:
      phone_input:
        allowlist:
          - US
          - CA
  - identity:
      oauth:
        providers:
          apple:
            disabled: true
  - identity:
      oauth:
        maximum_providers: 150
  - identity:
      oauth:
        providers:
          wechat:
            disabled: true
  - identity:
      login_id:
        types:
          phone:
            disabled: true
  - identity:
      biometric:
        disabled: true
  - authenticator:
      password:
        policy:
          history:
            disabled: true
  - authenticator:
      password:
        policy:
          minimum_guessable_level:
            disabled: true
  - collaborator:
      soft_maximum: 40
  - messaging:
      rate_limits:
        sms:
          enabled: true
          period: 30s
          burst: 3
  - messaging:
      rate_limits:
        email:
          enabled: true
          period: 1h
          burst: 9
result:
  authenticator:
    password:
      policy:
        history:
          disabled: true
        minimum_guessable_level:
          disabled: true
  identity:
    login_id:
      types:
        phone:
          disabled: true
    oauth:
      maximum_providers: 150
      providers:
        apple:
          disabled: true
        wechat:
          disabled: true
    biometric:
      disabled: true
  hook:
    blocking_handler:
      maximum: 5
    non_blocking_handler:
      maximum: 7
  admin_api:
    create_session_enabled: true
    user_import_usage:
      enabled: true
      period: day
      quota: 2
    user_export_usage:
      enabled: false
      period: month
      quota: 1
  ui:
    white_labeling:
      disabled: true
    phone_input:
      allowlist:
        - US
        - CA
  custom_domain:
    disabled: true
  oauth:
    client:
      maximum: 2
      soft_maximum: 20
      custom_ui_enabled: true
      app2app_enabled: false
  collaborator:
    maximum: 3
    soft_maximum: 40
  messaging:
    rate_limits:
      sms:
        enabled: true
        period: 30s
        burst: 3
      email:
        enabled: true
        period: 1h
        burst: 9
    whatsapp_usage_count_disabled: true
    custom_sms_provider_disabled: true
    sms_usage:
      enabled: true
      period: month
      quota: 5
  usage:
    hooks:
      - url: https://site.example.com/sms
        match: sms
      - url: https://project.example.com/all
        match: "*"
    limits:
      sms:
        - quota: 8
          period: month
          action: block
      email:
        - quota: 20
          period: month
          action: alert
