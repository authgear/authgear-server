query dynamicAccessResourcesQuery($first: Int, $scopesFirst: Int) {
  resources(first: $first) {
    totalCount
    edges {
      node {
        id
        name
        resourceURI
        accessPolicy {
          allowStaticFirstPartyClientAccess
          allowStaticThirdPartyClientAccess
          allowDynamicFirstPartyClientAccess
          allowDynamicThirdPartyClientAccess
        }
        scopes(first: $scopesFirst) {
          totalCount
          edges {
            node {
              id
              scope
              accessPolicy {
                allowStaticFirstPartyClientAccess
                allowStaticThirdPartyClientAccess
                allowDynamicFirstPartyClientAccess
                allowDynamicThirdPartyClientAccess
              }
            }
          }
        }
      }
    }
  }
}
