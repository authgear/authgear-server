mutation UpdateScopeMutation($input: UpdateScopeInput!) {
  updateScope(input: $input) {
    scope {
      id
      scope
      description
      resourceID
      accessPolicy {
        allowStaticFirstPartyClientAccess
        allowStaticThirdPartyClientAccess
        allowDynamicFirstPartyClientAccess
        allowDynamicThirdPartyClientAccess
      }
      createdAt
      updatedAt
    }
  }
}
